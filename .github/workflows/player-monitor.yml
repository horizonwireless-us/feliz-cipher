name: YouTube Player Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: youtube-player-monitor
  cancel-in-progress: false

jobs:
  check-player:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - name: Generate Feliz App token
        id: bot
        if: ${{ vars.FELIZ_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FELIZ_APP_ID }}
          private-key: ${{ secrets.FELIZ_APP_PRIVATE_KEY }}

      - name: Checkout feliz-cipher
        uses: actions/checkout@v4

      - name: Fetch known player configs
        run: |
          if curl -fsS --retry 3 --retry-delay 5 \
              "https://raw.githubusercontent.com/horizonwireless-us/feliz-cipher/main/library/src/main/assets/player_configs.json" \
              -o /tmp/player_configs.json; then
            echo "Fetched live player_configs.json from feliz-cipher main"
          else
            echo "::warning::Could not fetch live player_configs.json — falling back to local"
            cp library/src/main/assets/player_configs.json /tmp/player_configs.json
          fi

      - name: Scan live players (multi-sample to catch canaries early)
        id: scan
        run: |
          node monitor/scan-live-players.mjs /tmp/player_configs.json 30 > /tmp/scan.json 2> /tmp/scan.log
          cat /tmp/scan.log

          COUNT=$(node -e "process.stdout.write(String((JSON.parse(require('fs').readFileSync('/tmp/scan.json','utf8')).unknown||[]).length))")
          echo "unknown_count=$COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "summary<<SUMMARY_EOF"
            node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/scan.json','utf8'));console.log((s.unknown||[]).map(u=>'- '+u.hash+' (seen '+u.count+'x of '+s.samples+', md5 '+u.md5+', sts '+u.sts+')').join('\n'))"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Clone android-client for validation
        if: steps.scan.outputs.unknown_count != '0'
        uses: actions/checkout@v4
        with:
          repository: horizonwireless-us/android-client
          path: android-client
          token: ${{ steps.bot.outputs.token || github.token }}

      - name: Validate, post config to Mattermost, and create PR
        if: steps.scan.outputs.unknown_count != '0'
        id: pr_creator
        uses: actions/github-script@v7
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        with:
          github-token: ${{ steps.bot.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const scan = JSON.parse(
              fs.readFileSync('/tmp/scan.json', 'utf8')
            );

            async function notifyMattermost(message, isSuccess = true) {
              const webhookUrl = process.env.MATTERMOST_WEBHOOK_URL;

              if (!webhookUrl) {
                console.log(
                  '::warning::No MATTERMOST_WEBHOOK_URL — skipping Mattermost notification.'
                );
                return false;
              }

              const color = isSuccess ? '#00FF00' : '#FF0000';

              const payload = {
                username: 'Cipher Auto-Updater',
                attachments: [
                  {
                    color,
                    text: message
                  }
                ]
              };

              try {
                const resp = await fetch(webhookUrl, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(payload)
                });

                if (!resp.ok) {
                  console.log(
                    `::warning::Mattermost send failed: ${resp.status} ${await resp.text()}`
                  );
                  return false;
                }

                console.log('Mattermost notification sent successfully.');
                return true;
              } catch (e) {
                console.log(
                  `::warning::Mattermost send errored: ${e.message}`
                );
                return false;
              }
            }

            for (const u of scan.unknown || []) {
              const hash = u.hash;

              console.log(`Processing hash: ${hash}`);

              // Step 1: Validate with android-client harness
              let validationOutput;

              try {
                const androidClientPath = path.join(
                  process.env.GITHUB_WORKSPACE,
                  'android-client'
                );

                validationOutput = execSync(
                  `node tests/validate-player-config.mjs ${hash}`,
                  {
                    cwd: androidClientPath,
                    encoding: 'utf8',
                    timeout: 60000
                  }
                );

                console.log(`Validation successful for ${hash}`);
              } catch (error) {
                console.log(
                  `Validation failed for ${hash}: ${error.message}`
                );

                await notifyMattermost(
                  `❌ **Validation FAILED for player \`${hash}\`**\n` +
                  `Error: ${error.message}\n` +
                  `Manual intervention required: https://github.com/${context.repo.owner}/${context.repo.repo}/issues`,
                  false
                );

                continue;
              }

              // Step 2: Extract JSON entry from validation output
              const jsonMatch = validationOutput.match(/\{.*\}/s);

              if (!jsonMatch) {
                console.log(
                  `No JSON found in validation output for ${hash}`
                );

                await notifyMattermost(
                  `⚠️ **No JSON config found for \`${hash}\`**\n` +
                  `Validation output:\n\`\`\`\n${validationOutput}\n\`\`\``,
                  false
                );

                continue;
              }

              let newEntry;

              try {
                newEntry = JSON.parse(jsonMatch[0]);
              } catch (error) {
                console.log(
                  `Could not parse validation JSON for ${hash}: ${error.message}`
                );

                await notifyMattermost(
                  `⚠️ **Invalid JSON returned for \`${hash}\`**\n` +
                  `Error: ${error.message}`,
                  false
                );

                continue;
              }

              console.log(`Parsed config for ${hash}:`, newEntry);

              // Post the validated player config immediately.
              // This happens before git/PR work so a later failure does not
              // prevent the config from reaching Mattermost.
              await notifyMattermost(
                `🧩 **Validated YouTube player config**\n\n` +
                `- **Hash:** \`${hash}\`\n` +
                `- **MD5:** \`${u.md5}\`\n` +
                `- **sts:** \`${u.sts}\`\n` +
                `- **Observed:** ${u.count} of ${scan.samples} samples\n\n` +
                `**Player config:**\n` +
                `\`\`\`json\n${JSON.stringify(newEntry, null, 2)}\n\`\`\``,
                true
              );

              // Step 3: Update player_configs.json
              const configPath =
                'library/src/main/assets/player_configs.json';

              const currentConfig = JSON.parse(
                fs.readFileSync(configPath, 'utf8')
              );

              const exists = currentConfig.entries.some(
                e => e.hash === hash || e.md5 === u.md5
              );

              if (exists) {
                console.log(
                  `Hash ${hash} already in config, skipping.`
                );

                await notifyMattermost(
                  `ℹ️ **Player \`${hash}\` already configured** — config was validated and posted above; no PR is needed.`,
                  true
                );

                continue;
              }

              currentConfig.entries.push(newEntry);

              fs.writeFileSync(
                configPath,
                JSON.stringify(currentConfig, null, 2) + '\n'
              );

              // Step 4: Create branch and PR
              const branchName = `auto-add-player-${hash}`;
              const commitMessage =
                `config: auto-add player ${hash} [skip ci]`;

              execSync(
                'git config user.name "Cipher Auto-Updater"'
              );

              execSync(
                'git config user.email "cipher-bot@horizonwireless-us"'
              );

              execSync(`git checkout -b ${branchName}`);
              execSync(`git add ${configPath}`);
              execSync(`git commit -m "${commitMessage}"`);
              execSync(`git push origin ${branchName}`);

              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[AUTO] Add player config for ${hash}`,
                head: branchName,
                base: 'main',
                body:
                  `## Automated Player Config Update\n\n` +
                  `Detected new YouTube player hash: \`${hash}\`\n` +
                  `- **MD5**: \`${u.md5}\`\n` +
                  `- **sts**: \`${u.sts}\`\n` +
                  `- **Observed**: ${u.count} of ${scan.samples} samples\n\n` +
                  `✅ Validation passed with HTTP 206\n\n` +
                  `**This PR will auto-merge when CI passes.**\n` +
                  `(No manual intervention needed unless CI fails.)`
              });

              console.log(
                `Created PR #${pr.data.number} for ${hash}`
              );

              // Step 5: Post PR result to Mattermost
              await notifyMattermost(
                `✅ **Auto-PR created for player \`${hash}\`**\n` +
                `- PR: ${pr.data.html_url}\n` +
                `- Hash: \`${hash}\`\n` +
                `- MD5: \`${u.md5}\`\n` +
                `- sts: \`${u.sts}\`\n` +
                `- Will auto-merge on CI pass`,
                true
              );
            }

      - name: Send email notification
        if: ${{ !cancelled() && steps.scan.outputs.unknown_count != '0' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "New YouTube player(s) detected — cipher update required"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: Feliz CI <${{ secrets.GMAIL_USERNAME }}>
          body: |
            New / unknown YouTube player(s) detected by the multi-sample monitor — cipher update required.

            ${{ steps.scan.outputs.summary }}

            Automated PRs have been created. Check:
            https://github.com/horizonwireless-us/feliz-cipher/pulls
