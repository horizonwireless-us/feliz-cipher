name: Auto-merge player config PRs

on:
  workflow_run:
    workflows: ["Cipher CI"]
    types: [completed]

jobs:
  merge-player-config-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Find, verify, and merge automated player-config PR
        id: merge
        uses: actions/github-script@v9
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        with:
          github-token: ${{ secrets.FELIZ_BOT_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const configPath = 'library/src/main/assets/player_configs.json';

            async function notifyMattermost(message, isSuccess = true) {
              const webhookUrl = process.env.MATTERMOST_WEBHOOK_URL;
              if (!webhookUrl) {
                core.warning('No MATTERMOST_WEBHOOK_URL - skipping Mattermost notification.');
                return;
              }

              try {
                const response = await fetch(webhookUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    username: 'Cipher Auto-Updater',
                    attachments: [{
                      color: isSuccess ? '#00FF00' : '#FF0000',
                      text: message
                    }]
                  })
                });

                if (!response.ok) {
                  core.warning(`Mattermost send failed: ${response.status} ${await response.text()}`);
                }
              } catch (error) {
                core.warning(`Mattermost send errored: ${error.message}`);
              }
            }

            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: run.head_sha
            });

            const candidates = associated.data.filter(pr =>
              pr.state === 'open' &&
              pr.base.ref === 'main' &&
              pr.head.repo?.full_name === `${owner}/${repo}` &&
              pr.head.ref.startsWith('auto-add-players-')
            );

            if (candidates.length === 0) {
              console.log(`No eligible automated PR is associated with ${run.head_sha}; nothing to merge.`);
              return;
            }

            if (candidates.length !== 1) {
              throw new Error(`Expected exactly one eligible automated PR for ${run.head_sha}, found ${candidates.length}.`);
            }

            const pr = candidates[0];

            if (pr.draft) {
              throw new Error(`PR #${pr.number} is a draft; refusing to auto-merge.`);
            }

            const changedFiles = [];
            for await (const response of github.paginate.iterator(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            )) {
              changedFiles.push(...response.data.map(file => file.filename));
            }

            if (changedFiles.length !== 1 || changedFiles[0] !== configPath) {
              await notifyMattermost(
                `❌ **Auto-merge refused for PR #${pr.number}**\n\n` +
                `Expected only \`${configPath}\`, but found:\n` +
                changedFiles.map(file => `- \`${file}\``).join('\n'),
                false
              );
              throw new Error(`PR #${pr.number} changes unexpected files: ${changedFiles.join(', ')}`);
            }

            const freshPr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number
            });

            if (freshPr.data.head.sha !== run.head_sha) {
              throw new Error(
                `PR #${pr.number} head moved from ${run.head_sha} to ${freshPr.data.head.sha}; refusing stale auto-merge.`
              );
            }

            const merged = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${pr.number})`
            });

            if (!merged.data.merged) {
              await notifyMattermost(
                `❌ **Auto-merge failed for PR #${pr.number}**\n\n${merged.data.message || 'GitHub did not merge the PR.'}`,
                false
              );
              throw new Error(`GitHub refused to merge PR #${pr.number}: ${merged.data.message || 'unknown reason'}`);
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${pr.head.ref}`
              });
              console.log(`Deleted branch ${pr.head.ref}.`);
            } catch (error) {
              core.warning(`Merged PR but could not delete ${pr.head.ref}: ${error.message}`);
            }

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('merge_sha', merged.data.sha || '');

            await notifyMattermost(
              `✅ **Player config PR merged**\n\n` +
              `- PR: ${pr.html_url}\n` +
              `- CI: ${run.html_url}\n` +
              `- Merge SHA: \`${merged.data.sha || 'unknown'}\``,
              true
            );
