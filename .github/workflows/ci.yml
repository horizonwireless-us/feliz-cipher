name: Cipher CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate player_configs.json schema
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import { parsePlayerConfigs } from './monitor/player-configs.mjs'; parsePlayerConfigs(fs.readFileSync('library/src/main/assets/player_configs.json', 'utf8')); console.log('player_configs.json schema OK');"

      - name: Run monitor harness tests
        run: node --test monitor/scan-live-players.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # GitHub-hosted ubuntu runners already ship an Android SDK with licenses
      # accepted; android-actions/setup-android@v3 is NOT used here because it
      # runs `sdkmanager tools`, and the legacy `tools` package no longer exists
      # in the SDK repository (replaced by cmdline-tools) → CI fails.

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run cipher unit tests
        run: ./gradlew :library:testDebugUnitTest

      - name: Assemble cipher release AAR
        run: ./gradlew :library:assembleRelease
